[package]
name = "cargo-cbom"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Post-quantum readiness check and CycloneDX Cryptography Bill of Materials (CBOM) for Rust projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Senturkselim/cargo-cbom"
readme = "README.md"
keywords = ["cbom", "post-quantum", "cryptography", "cargo-subcommand", "cyclonedx"]
categories = ["development-tools::cargo-plugins", "cryptography", "command-line-utilities"]
include = ["src/**/*", "rules/**/*", "README.md", "README.tr.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md"]

[[bin]]
name = "cargo-cbom"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"

[dev-dependencies]
jsonschema = { version = "0.63", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
