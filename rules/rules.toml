  { name = "Schnorr secp256k1 (BIP-340)", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDH secp256k1", primitive = "key-agree", status = "quantum-vulnerable" },
