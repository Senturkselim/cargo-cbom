# ---------------------------------------------------------------------------
# Tokens, certificates and HPKE
# ---------------------------------------------------------------------------

[[rule]]
id = "jsonwebtoken"
crate = "jsonwebtoken"
title = "JSON Web Tokens (jsonwebtoken)"
status = "depends"
note = "Supports HMAC (HS*), RSA (RS*, PS*), ECDSA (ES*) and Ed25519 (EdDSA), but not ML-DSA (checked in 12.0.0). RSA, ECDSA and Ed25519 tokens are quantum-vulnerable; HMAC tokens are not."
fix = "For post-quantum JWTs, jwt-simple 0.13+ supports ML-DSA (RFC 9964)."
reference = "https://docs.rs/jsonwebtoken"
algorithms = [
  { name = "HMAC", primitive = "mac", status = "symmetric" },
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
]

[[rule]]
id = "jwt-simple-ml-dsa"
crate = "jwt-simple"
group = "jwt-simple"
versions = ">=0.13.0"
title = "JSON Web Tokens (jwt-simple, ML-DSA capable)"
status = "depends"
note = "Supports ML-DSA-44/65/87 (RFC 9964) since 0.13.0, next to HMAC, RSA, ECDSA and Ed25519. Tokens are post-quantum only when signed with an ML-DSA key."
reference = "https://docs.rs/jwt-simple"
algorithms = [
  { name = "ML-DSA", primitive = "signature", parameter_set = "44", functions = ["sign", "verify"], status = "post-quantum", nist_level = 2 },
  { name = "ML-DSA", primitive = "signature", parameter_set = "65", functions = ["sign", "verify"], status = "post-quantum", nist_level = 3 },
  { name = "ML-DSA", primitive = "signature", parameter_set = "87", functions = ["sign", "verify"], status = "post-quantum", nist_level = 5 },
  { name = "HMAC", primitive = "mac", status = "symmetric" },
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
]

