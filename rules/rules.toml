# cargo-cbom rules (schema 1)
#
# Each [[rule]] matches one crate. Optional filters:
#   versions       comma-separated comparisons with full versions, e.g. ">=0.23.22, <0.24.0-0"
#                  (pre-releases follow normal semver precedence; build metadata is ignored)
#   features_all   every listed Cargo feature is enabled on that crate
#   features_any   at least one listed feature is enabled
#   features_none  none of the listed features is enabled
#   group          rules in the same group are tried in file order; the first match wins
#
# `status` is the verdict for the project. Each algorithm's `status` describes the
# algorithm itself. If `status` is omitted, the worst algorithm status is used.
#
# Statuses:   classically-broken, known-vulnerable, quantum-vulnerable, pre-standard-pq,
#             depends, symmetric, hybrid, post-quantum
# Primitives: drbg, mac, block-cipher, stream-cipher, signature, hash, pke, xof, kdf,
#             key-agree, kem, ae, combiner, other, unknown (CycloneDX 1.6)
#
# Every rule needs a `reference`. Claims about specific versions were checked against
# the published crate sources; notes name the version that was checked.

schema = 1

# ---------------------------------------------------------------------------
# TLS: rustls key exchange. The provider and the `prefer-post-quantum` feature
# decide whether the hybrid X25519MLKEM768 group is used.
# Checked against rustls 0.23.21, 0.23.22, 0.23.26, 0.23.27 and 0.23.46.
# ---------------------------------------------------------------------------

[[rule]]
id = "rustls-0-24-preview"
crate = "rustls"
group = "rustls-kx"
versions = ">=0.24.0-0"
title = "rustls 0.24 preview, not modeled yet"
category = "tls"
status = "depends"
note = "rustls 0.24 changes how crypto providers are packaged and cargo-cbom does not model it yet. Check which provider your application installs."
reference = "https://github.com/rustls/rustls"

[[rule]]
id = "rustls-legacy"
crate = "rustls"
group = "rustls-kx"
versions = "<0.23.0"
title = "rustls before 0.23, classical only"
category = "tls"
status = "quantum-vulnerable"
note = "rustls before 0.23 only offers classical key exchange (X25519, P-256, P-384)."
fix = "Upgrade to rustls 0.23.27 or later with the aws-lc-rs provider, where X25519MLKEM768 is preferred by default."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-256", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-384", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "rustls-custom-provider"
crate = "rustls"
group = "rustls-kx"
features_any = ["custom-provider"]
title = "custom crypto provider"
category = "tls"
status = "depends"
note = "The `custom-provider` feature is enabled, so the application supplies its own CryptoProvider and key exchange depends on it."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"

[[rule]]
id = "rustls-two-providers"
crate = "rustls"
group = "rustls-kx"
features_all = ["aws_lc_rs", "ring"]
title = "aws-lc-rs and ring both compiled in"
category = "tls"
status = "depends"
note = "With both providers compiled in, rustls cannot pick a default from crate features: the provider your code installs, or the one a dependency chooses, decides. aws-lc-rs offers X25519MLKEM768; ring has no post-quantum key exchange."
fix = "Call `rustls::crypto::aws_lc_rs::default_provider().install_default()` at startup and enable rustls' `prefer-post-quantum` feature."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"

[[rule]]
id = "rustls-ring"
crate = "rustls"
group = "rustls-kx"
features_all = ["ring"]
features_none = ["aws_lc_rs"]
title = "ring provider, no post-quantum groups"
category = "tls"
status = "quantum-vulnerable"
note = "The ring provider only offers X25519, P-256 and P-384 key exchange; it has no post-quantum groups (checked in rustls 0.23.46)."
fix = "Switch to the aws-lc-rs provider: enable rustls' `aws_lc_rs` and `prefer-post-quantum` features (rustls 0.23.27+) and call `rustls::crypto::aws_lc_rs::default_provider().install_default()` at startup. Some clients, such as ureq 3, use ring unless a provider is installed."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-256", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-384", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "rustls-aws-lc-rs-before-pq"
crate = "rustls"
group = "rustls-kx"
versions = "<0.23.22"
features_all = ["aws_lc_rs"]
title = "aws-lc-rs provider without a built-in post-quantum group"
category = "tls"
status = "quantum-vulnerable"
note = "rustls before 0.23.22 has no built-in post-quantum key exchange; it needed the separate rustls-post-quantum crate."
fix = "Upgrade to rustls 0.23.27 or later, where X25519MLKEM768 is built in and preferred by default."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-256", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-384", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "rustls-pq-preferred"
crate = "rustls"
group = "rustls-kx"
versions = ">=0.23.22"
features_all = ["aws_lc_rs", "prefer-post-quantum"]
title = "aws-lc-rs provider, post-quantum preferred"
category = "tls"
status = "hybrid"
note = "X25519MLKEM768 is offered first. Classical X25519, P-256 and P-384 remain as fallbacks for peers without post-quantum support."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"
algorithms = [
  { name = "X25519MLKEM768", primitive = "kem", status = "hybrid", nist_level = 3 },
]

[[rule]]
id = "rustls-pq-not-preferred"
crate = "rustls"
group = "rustls-kx"
versions = ">=0.23.22"
features_all = ["aws_lc_rs"]
features_none = ["prefer-post-quantum"]
title = "aws-lc-rs provider, post-quantum not preferred"
category = "tls"
status = "depends"
note = "X25519MLKEM768 is supported but offered last. As a TLS client, rustls starts with a classical X25519 key share, so the hybrid group is used only if the server asks for it (HelloRetryRequest). As a server, rustls follows the client's preference."
fix = "Enable rustls' `prefer-post-quantum` feature in your own Cargo.toml, e.g. `rustls = { version = \"0.23.27\", default-features = false, features = [\"prefer-post-quantum\"] }`. Cargo's feature unification applies it to the rustls your dependencies use."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"
algorithms = [
  { name = "X25519MLKEM768", primitive = "kem", status = "hybrid", nist_level = 3 },
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "rustls-no-builtin-provider"
crate = "rustls"
group = "rustls-kx"
features_none = ["aws_lc_rs", "ring"]
title = "no built-in provider"
category = "tls"
status = "depends"
note = "Neither the aws-lc-rs nor the ring provider is enabled, so the application installs another CryptoProvider and key exchange depends on it."
reference = "https://docs.rs/rustls/latest/rustls/#cryptography-providers"

[[rule]]
id = "rustls-post-quantum"
crate = "rustls-post-quantum"
title = "rustls-post-quantum provider (only if installed)"
category = "tls"
status = "depends"
note = "Provides a CryptoProvider with X25519MLKEM768 that only takes effect if your code installs it. Since rustls 0.23.22 the same key exchange is built into rustls."
fix = "On rustls 0.23.27+, the built-in aws-lc-rs provider with `prefer-post-quantum` gives the same key exchange."
reference = "https://docs.rs/rustls-post-quantum"
algorithms = [
  { name = "X25519MLKEM768", primitive = "kem", status = "hybrid", nist_level = 3 },
]

[[rule]]
id = "ureq-ring-default"
crate = "ureq"
versions = ">=3.5.0, <4.0.0"
features_all = ["_ring"]
title = "ureq selects ring unless a provider is installed"
category = "tls"
status = "depends"
note = "ureq 3 uses the provider set in its TlsConfig, then the process-wide rustls default, then ring (checked in 3.5.2). ring has no post-quantum key exchange, so enabling aws-lc-rs features alone does not change ureq's TLS."
fix = "Install `rustls::crypto::aws_lc_rs::default_provider()` as the process default at startup, or pass it in ureq's TlsConfig."
reference = "https://docs.rs/ureq"

# ---------------------------------------------------------------------------
# TLS: BoringSSL, OpenSSL and platform TLS
# ---------------------------------------------------------------------------

[[rule]]
id = "boring-pq-default"
crate = "boring"
group = "boring-kx"
versions = ">=5.3.0"
title = "BoringSSL, X25519MLKEM768 by default"
category = "tls"
status = "hybrid"
note = "boring 5.3 and later document that BoringSSL supports and enables X25519MLKEM768 by default."
reference = "https://docs.rs/boring/latest/boring/#post-quantum-cryptography"
algorithms = [
  { name = "X25519MLKEM768", primitive = "kem", status = "hybrid", nist_level = 3 },
]

[[rule]]
id = "boring-before-pq-default"
crate = "boring"
group = "boring-kx"
versions = "<5.3.0"
title = "older boring, no ML-KEM by default"
category = "tls"
status = "depends"
note = "Older boring releases document only the pre-standard X25519Kyber768Draft00 hybrid, behind an opt-in feature."
fix = "Upgrade to boring 5.3.0 or later, where X25519MLKEM768 is enabled by default."
reference = "https://docs.rs/boring/latest/boring/#post-quantum-cryptography"

[[rule]]
id = "boring-general"
crate = "boring"
title = "BoringSSL bindings (general-purpose crypto)"
status = "depends"
note = "Exposes classical public-key algorithms; recent releases also have optional `mlkem` and `mldsa` modules (checked in 5.6.0). Which ones are used depends on your code."
reference = "https://docs.rs/boring"
algorithms = [
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "openssl-src-pq"
crate = "openssl-src"
group = "openssl-src-tls"
versions = ">=300.5.0"
title = "vendored OpenSSL 3.5+, X25519MLKEM768 by default"
category = "tls"
status = "hybrid"
note = "OpenSSL 3.5 and later put X25519MLKEM768 in the default TLS group list and ship ML-KEM, ML-DSA and SLH-DSA."
reference = "https://developers.cloudflare.com/ssl/post-quantum-cryptography/pqc-support/"
algorithms = [
  { name = "X25519MLKEM768", primitive = "kem", status = "hybrid", nist_level = 3 },
  { name = "ML-KEM", primitive = "kem", status = "post-quantum" },
  { name = "ML-DSA", primitive = "signature", status = "post-quantum" },
  { name = "SLH-DSA", primitive = "signature", status = "post-quantum" },
]

[[rule]]
id = "openssl-src-before-pq"
crate = "openssl-src"
group = "openssl-src-tls"
versions = "<300.5.0"
title = "vendored OpenSSL before 3.5, classical only"
category = "tls"
status = "quantum-vulnerable"
note = "OpenSSL before 3.5 has no built-in ML-KEM, so TLS key exchange is classical."
fix = "Upgrade openssl-src to 300.5.0 or later (OpenSSL 3.5+)."
reference = "https://developers.cloudflare.com/ssl/post-quantum-cryptography/pqc-support/"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ECDH P-256", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "openssl-sys-system"
crate = "openssl-sys"
features_none = ["vendored"]
title = "system OpenSSL, depends on its version"
category = "tls"
status = "depends"
note = "Links the OpenSSL (or compatible library) installed on the build machine. TLS uses X25519MLKEM768 by default only with OpenSSL 3.5 or later; check with `openssl version`."
reference = "https://docs.rs/openssl"

[[rule]]
id = "openssl-general"
crate = "openssl"
title = "OpenSSL bindings (general-purpose crypto)"
status = "depends"
note = "Exposes many algorithms; which ones are used depends on your code. Post-quantum algorithms need OpenSSL 3.5 or later underneath."
reference = "https://docs.rs/openssl"
algorithms = [
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "RSA", primitive = "pke", functions = ["encrypt", "decrypt"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
]

[[rule]]
id = "native-tls"
crate = "native-tls"
title = "platform TLS library"
category = "tls"
status = "depends"
note = "Uses the operating system's TLS library (OpenSSL on Linux, Schannel on Windows, Security.framework on Apple platforms). Post-quantum key exchange depends on that library; on Linux it needs OpenSSL 3.5 or later."
reference = "https://docs.rs/native-tls"

# ---------------------------------------------------------------------------
# General-purpose crypto libraries
# ---------------------------------------------------------------------------

[[rule]]
id = "aws-lc-rs"
crate = "aws-lc-rs"
title = "AWS-LC (general-purpose crypto library)"
status = "depends"
note = "Provides classical and post-quantum algorithms: ML-KEM in the `kem` module and ML-DSA in the `signature` module (checked in 1.19.0). Which ones are used depends on your code and dependencies."
reference = "https://docs.rs/aws-lc-rs"
algorithms = [
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "ML-KEM", primitive = "kem", parameter_set = "512", status = "post-quantum", nist_level = 1 },
  { name = "ML-KEM", primitive = "kem", parameter_set = "768", status = "post-quantum", nist_level = 3 },
  { name = "ML-KEM", primitive = "kem", parameter_set = "1024", status = "post-quantum", nist_level = 5 },
  { name = "ML-DSA", primitive = "signature", parameter_set = "44", status = "post-quantum", nist_level = 2 },
  { name = "ML-DSA", primitive = "signature", parameter_set = "65", status = "post-quantum", nist_level = 3 },
  { name = "ML-DSA", primitive = "signature", parameter_set = "87", status = "post-quantum", nist_level = 5 },
]

[[rule]]
id = "ring"
crate = "ring"
title = "ring (general-purpose crypto library)"
status = "depends"
note = "Offers only classical public-key algorithms (RSA, ECDSA, Ed25519, X25519/ECDH) and no post-quantum algorithms (checked in 0.17.14)."
reference = "https://docs.rs/ring"
algorithms = [
  { name = "RSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ECDSA", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "AES-GCM", primitive = "ae", status = "symmetric" },
  { name = "ChaCha20-Poly1305", primitive = "ae", status = "symmetric" },
  { name = "SHA-2", primitive = "hash", status = "symmetric" },
  { name = "HMAC", primitive = "mac", status = "symmetric" },
]

[[rule]]
id = "libsodium-sys-stable"
crate = "libsodium-sys-stable"
title = "libsodium bindings"
status = "depends"
note = "Classical X25519 and Ed25519; libsodium 1.0.22 (bundled by 1.24.6) also exposes ML-KEM-768 and the X-Wing KEM. Which ones are used depends on your code."
reference = "https://docs.rs/libsodium-sys-stable"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "ML-KEM", primitive = "kem", parameter_set = "768", status = "post-quantum", nist_level = 3 },
  { name = "X-Wing", primitive = "kem", status = "hybrid", nist_level = 3 },
]

[[rule]]
id = "sodiumoxide"
crate = "sodiumoxide"
title = "sodiumoxide (libsodium wrapper)"
status = "depends"
note = "No release since 0.2.7 (2021). Its public-key algorithms are classical."
fix = "Consider a maintained library; for post-quantum key exchange see ml-kem or x-wing."
reference = "https://docs.rs/sodiumoxide"
algorithms = [
  { name = "X25519", primitive = "key-agree", status = "quantum-vulnerable" },
  { name = "Ed25519", primitive = "signature", functions = ["sign", "verify"], status = "quantum-vulnerable" },
  { name = "XSalsa20-Poly1305", primitive = "ae", status = "symmetric" },
]

